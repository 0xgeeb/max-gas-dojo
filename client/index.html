<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martial Hero Fighter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #87CEEB;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        

        
        .health-bar {
            width: 200px;
            height: 20px;
            background: #444;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff0000, #ff6600);
            transition: width 0.3s ease;
        }

        /* Web3 UI Styles */
        #web3Container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            z-index: 1000;
            cursor: pointer;
            transition: background 0.2s;
            font-family: monospace;
        }

        #web3Container:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        .hidden {
            display: none;
        }

        /* Lobby UI Styles */
        #playerListSidebar {
            position: absolute;
            top: 0;
            right: 0;
            width: 250px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4A90E2;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 18px;
        }

        #playerCount {
            color: #4A90E2;
            font-weight: bold;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-card.me {
            background: rgba(74, 144, 226, 0.3);
            border: 1px solid #4A90E2;
        }

        .player-name {
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 120px;
        }

        .challenge-btn {
            background: #4A90E2;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .challenge-btn:hover {
            background: #357ABD;
        }

        .challenge-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Challenge Modal */
        #challengeModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 10px;
            z-index: 1000;
            min-width: 400px;
            border: 2px solid #4A90E2;
            color: white;
        }

        #challengeModal h2 {
            margin-top: 0;
            color: #4A90E2;
        }

        .challenge-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .challenge-item p {
            margin: 5px 0;
        }

        .challenge-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .accept-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 3px;
            cursor: pointer;
            flex: 1;
        }

        .accept-btn:hover {
            background: #218838;
        }

        .decline-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 3px;
            cursor: pointer;
            flex: 1;
        }

        .decline-btn:hover {
            background: #c82333;
        }

        /* Challenge Toast */
        #challengeToast {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74, 144, 226, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            z-index: 1001;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { top: 50px; opacity: 0; }
            to { top: 100px; opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Web3 Wallet UI -->
        <div id="web3Container">connect</div>

        <!-- Player List Sidebar -->
        <div id="playerListSidebar" class="hidden">
            <div class="sidebar-header">
                <h3>Players in Lobby</h3>
                <span id="playerCount">0/10</span>
            </div>
            <div id="playerListContent"></div>
        </div>

        <!-- Challenge Modal -->
        <div id="challengeModal" class="hidden">
            <h2>Incoming Challenges</h2>
            <div id="challengeList"></div>
        </div>

        <!-- Challenge Toast -->
        <div id="challengeToast" class="hidden">
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="web3.js"></script>
    <script src="sprites.js"></script>
    <script src="input.js"></script>
    <script src="ui.js"></script>
    <script src="game.js"></script>
</body>
</html>
