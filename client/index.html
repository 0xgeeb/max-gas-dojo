<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martial Hero Fighter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #87CEEB;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        

        
        .health-bar {
            width: 200px;
            height: 20px;
            background: #444;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff0000, #ff6600);
            transition: width 0.3s ease;
        }

        /* Web3 UI Styles */
        #web3Container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            z-index: 1000;
            min-width: 300px;
        }

        #web3Container h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 10px;
        }

        .web3-section {
            margin-bottom: 15px;
        }

        .web3-section label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 12px;
        }

        .web3-button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background: #4A90E2;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .web3-button:hover {
            background: #357ABD;
        }

        .web3-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .web3-button.success {
            background: #28a745;
        }

        .web3-button.success:hover {
            background: #218838;
        }

        .web3-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        .web3-info {
            background: rgba(74, 144, 226, 0.2);
            padding: 10px;
            border-radius: 5px;
            margin: 5px 0;
            font-size: 12px;
        }

        .web3-status {
            padding: 8px;
            border-radius: 5px;
            margin: 5px 0;
            font-size: 12px;
            text-align: center;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .status-success {
            background: rgba(40, 167, 69, 0.3);
            color: #28a745;
        }

        .status-error {
            background: rgba(220, 53, 69, 0.3);
            color: #dc3545;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Web3 Wallet & Staking UI -->
        <div id="web3Container">
            <h3>Web3 Wallet</h3>

            <!-- Wallet Connection -->
            <div class="web3-section" id="walletSection">
                <button id="connectWalletBtn" class="web3-button">Connect Wallet</button>
                <div id="walletInfo" class="web3-info hidden">
                    <div><strong>Address:</strong> <span id="walletAddress">-</span></div>
                    <div><strong>Balance:</strong> <span id="tokenBalance">0</span> FIGHT</div>
                </div>
            </div>

            <!-- Staking Section -->
            <div class="web3-section hidden" id="stakingSection">
                <label>Stake Amount (FIGHT tokens)</label>
                <input type="number" id="stakeAmount" class="web3-input" placeholder="Enter amount" min="0" step="0.01" value="1.0">

                <button id="approveBtn" class="web3-button hidden">Approve Tokens</button>
                <button id="stakeBtn" class="web3-button" disabled>Stake & Join Match</button>

                <div id="txStatus" class="web3-status hidden"></div>
            </div>

            <!-- Network Info -->
            <div class="web3-section">
                <div class="web3-info" style="font-size: 11px;">
                    <div><strong>Network:</strong> <span id="networkName">Not connected</span></div>
                    <div><strong>Contract:</strong> <span id="contractStatus">Not deployed</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="web3.js"></script>
    <script src="sprites.js"></script>
    <script src="input.js"></script>
    <script src="game.js"></script>
</body>
</html>
