<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martial Hero Fighter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #87CEEB;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        

        
        .health-bar {
            width: 200px;
            height: 20px;
            background: #444;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff0000, #ff6600);
            transition: width 0.3s ease;
        }

        /* Web3 UI Styles */
        #web3Container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            z-index: 1000;
            cursor: pointer;
            transition: background 0.2s;
            font-family: monospace;
        }

        #web3Container:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Web3 Wallet UI -->
        <div id="web3Container">connect</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="web3.js"></script>
    <script src="sprites.js"></script>
    <script src="input.js"></script>
    <script src="game.js"></script>
</body>
</html>
